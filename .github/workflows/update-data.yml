name: Update item data

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      inspect:
        description: "Only report the categories found in the game data; do not update anything"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch item data
        run: python scripts/fetch_items.py ${{ inputs.inspect && '--inspect' || '' }}

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain data/items.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/items.json
            git commit -m "Update item data"
            git push
          else
            echo "No changes to commit."
          fi
