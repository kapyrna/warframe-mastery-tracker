name: Fetch Public Export
on:
  schedule:
    - cron: "30 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/fetch_public_export_index.py
      - run: python scripts/fetch_public_export_manifests.py
      - run: python scripts/fetch_public_export_images.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update Public Export data index"
          git push
