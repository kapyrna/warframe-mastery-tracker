<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Warframe Public Export</title>
	<meta name="description" content="A cache of the Warframe API in context of Mastery Rank tracking.">
	<link rel="stylesheet" href="css/style.css">
</head>

<header class="site-header">
    Warframe Public Export (cache)
    <div class="header-row>">
        <p class="sub">
            <span class="sentence">This is a snapshot of the Public Export data used in the tracker.</span>
        </p>
    </div>
</header>

<main>
    <section class="card" aria-label="summary-h">
        <h2 id="summary">Public Export Index</h2>
		<p class="muted small" id="status"></p>
		<script>
			fetch("data/status.json")
				.then(r => r.json())
				.then(s => {
					const f = t => new Date(t).toLocaleString();
					document.getElementById("status").textContent =`Data last changed: ${f(s.last_changed)} · Last checked: ${f(s.last_checked)}`;
				})
				.catch(() => {});
		</script>
	</section>
</main>
